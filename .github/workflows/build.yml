name: Build TinkerLeveling

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 TinkerLeveling 仓库
      - name: Checkout TinkerLeveling
        uses: actions/checkout@v4
        with:
          path: TinkerLeveling-1.21.1

      # 2. 检出匠魂源码仓库到同级目录
      - name: Checkout Tinkers' Construct
        uses: actions/checkout@v4
        with:
          repository: zhuchuovo/TinkersConstruct-1.21.1
          path: TinkersConstruct-1.21.1

      # 3. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. 设置 Gradle（启用依赖缓存，加速构建）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. 确保匠魂仓库的 Gradle Wrapper 存在
      - name: Ensure Tinkers' Construct Gradle Wrapper
        working-directory: TinkersConstruct-1.21.1
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "匠魂仓库 gradle-wrapper.jar 缺失，正在重新生成..."
            gradle wrapper
          else
            echo "匠魂仓库 gradle-wrapper.jar 已存在。"
          fi

      # 6. 构建匠魂本体，生成 TinkerLeveling 所需的 JAR
      - name: Build Tinkers' Construct
        working-directory: TinkersConstruct-1.21.1
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      # 7. 定位匠魂构建出的 JAR 路径，写入环境变量
      - name: Locate Tinkers' Construct JAR
        id: locate_tconstruct
        run: |
          JAR_PATH=$(find "$GITHUB_WORKSPACE/TinkersConstruct-1.21.1/build/libs" -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::未找到匠魂构建产物 JAR"
            exit 1
          fi
          echo "找到匠魂 JAR: $JAR_PATH"
          echo "tconstruct_jar=$JAR_PATH" >> "$GITHUB_OUTPUT"

      # 8. 确保 TinkerLeveling 仓库的 Gradle Wrapper 存在
      - name: Ensure TinkerLeveling Gradle Wrapper
        working-directory: TinkerLeveling-1.21.1
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "TinkerLeveling gradle-wrapper.jar 缺失，正在重新生成..."
            gradle wrapper
          else
            echo "TinkerLeveling gradle-wrapper.jar 已存在。"
          fi

      # 9. 构建 TinkerLeveling，显式传入匠魂 JAR 路径
      - name: Build TinkerLeveling
        working-directory: TinkerLeveling-1.21.1
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon \
            -Ptconstruct_jar="${{ steps.locate_tconstruct.outputs.tconstruct_jar }}"

      # 10. 上传 TinkerLeveling 的构建产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tinkerleveling-artifacts
          path: TinkerLeveling-1.21.1/build/libs/*.jar
          if-no-files-found: error